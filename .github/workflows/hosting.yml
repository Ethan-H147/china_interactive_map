name: Check hosted atlas delivery
on:
  push:
    branches: [main]
    paths: ['hosting/**', '.github/workflows/hosting.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  delivery:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node hosting/test.mjs
