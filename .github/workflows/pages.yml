name: Deploy website to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'dist/**'
      - 'scripts/**'
      - 'package*.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  browser-tests:
    # Real headless Chrome: phone sheet gestures and keyboard, level toggles, every
    # country's search and selection, country switching and developer-mode gating.
    # The suite runs in five parallel shards (scripts/browser/run.mjs --shard), about 4 minutes each.
    # A commit whose message contains [skip tests] (changes the owner says need no test) deploys without it.
    if: ${{ !contains(github.event.head_commit.message, '[skip tests]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    steps:
      - name: Check out website
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run browser scenarios
        run: node scripts/browser/run.mjs --shard=${{ matrix.shard }}/5
      - name: Keep failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-screenshots-${{ matrix.shard }}
          path: artifacts/browser-tests/
  deploy:
    needs: browser-tests
    if: ${{ !cancelled() && (needs.browser-tests.result == 'success' || needs.browser-tests.result == 'skipped') }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out website
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install validation dependencies
        run: npm ci --ignore-scripts
      - name: Check country data and international borders
        run: npm run test:botswana-namibia
      - name: Check satellite transparency and polygon rendering
        run: npm run test:satellite && npm run test:polygon-parts
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          # Pages processing of the ~360 MB site occasionally exceeds the default 10 minutes.
          timeout: 1800000
