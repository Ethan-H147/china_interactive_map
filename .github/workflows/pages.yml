name: Deploy website to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'dist/**'
      - 'scripts/**'
      - 'package*.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  prepare-site:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - name: Check routes, runtime and published source integrity
        run: npm run test:deployment
      - name: Stamp and build the verified Pages package
        run: |
          node -e 'require("fs").writeFileSync("dist/version.json",JSON.stringify({version:process.env.GITHUB_SHA}))'
          node --max-old-space-size=8000 scripts/build-pages-package.mjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: artifacts/pages
      - name: Keep package audit
        uses: actions/upload-artifact@v4
        with:
          name: pages-package-audit
          path: artifacts/pages-package-report.json

  deploy:
    needs: prepare-site
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          timeout: 1800000
