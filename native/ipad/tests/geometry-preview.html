<!doctype html><meta charset="utf-8"><title>Native mesh verification — not an iPad app screenshot</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f4f0e8}canvas{width:100%;height:100%;display:block}</style><canvas></canvas>
<script type="module">
const canvas=document.querySelector('canvas'),gl=canvas.getContext('webgl2',{preserveDrawingBuffer:true,antialias:true});
if(!gl)throw Error('WebGL2 unavailable for geometry verification');
canvas.width=innerWidth;canvas.height=innerHeight;
const base='../BoundaryAtlas.swiftpm/Sources/AtlasCore/Resources/',m=await(await fetch(base+'Countries/china/catalogue.json')).json();
const vertex=`#version 300 es
precision highp float;in vec4 v;uniform vec3 right,up,forward;uniform float zoom,aspect,selected;out vec3 color;out float front;
void main(){vec2 r=radians(v.xy);vec3 p=vec3(cos(r.y)*cos(r.x),sin(r.y),cos(r.y)*sin(r.x));float radius=v.z>0.?1.0008:v.z==0.?1.0003:1.;front=dot(p,forward);float depth=(1.-front*radius)*.45+.05;gl_Position=vec4(dot(p,right)*zoom/aspect*radius,dot(p,up)*zoom*radius,depth*2.-1.,1.);color=v.z<0.?vec3(.925,.945,.945):v.z==0.?vec3(.86,.855,.825):abs(v.z-selected)<.1?vec3(.86,.62,.43):vec3(.925,.865,.72);}`;
const fragment=`#version 300 es
precision highp float;in vec3 color;in float front;out vec4 outColor;void main(){if(front<0.)discard;outColor=vec4(color,1.);}`;
function shader(type,text){let s=gl.createShader(type);gl.shaderSource(s,text);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(s));return s;}
const program=gl.createProgram();gl.attachShader(program,shader(gl.VERTEX_SHADER,vertex));gl.attachShader(program,shader(gl.FRAGMENT_SHADER,fragment));gl.linkProgram(program);if(!gl.getProgramParameter(program,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(program));gl.useProgram(program);
async function mesh(meta){const vao=gl.createVertexArray();gl.bindVertexArray(vao);let v=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,v);gl.bufferData(gl.ARRAY_BUFFER,await(await fetch(base+meta.fills)).arrayBuffer(),gl.STATIC_DRAW);const attr=gl.getAttribLocation(program,'v');gl.enableVertexAttribArray(attr);gl.vertexAttribPointer(attr,4,gl.FLOAT,false,16,0);let i=gl.createBuffer();gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,i);gl.bufferData(gl.ELEMENT_ARRAY_BUFFER,await(await fetch(base+meta.indices)).arrayBuffer(),gl.STATIC_DRAW);return{vao,count:meta.indexCount};}
const background=await mesh(m.background),country=await mesh(m.geometry);
const sphere=[];for(let lat=-90;lat<90;lat+=3)for(let lon=-180;lon<180;lon+=3)for(const p of [[lon,lat],[lon+3,lat],[lon+3,lat+3],[lon,lat],[lon+3,lat+3],[lon,lat+3]])sphere.push(...p,-1,0);
const ocean=gl.createVertexArray();gl.bindVertexArray(ocean);const buf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buf);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(sphere),gl.STATIC_DRAW);const attr=gl.getAttribLocation(program,'v');gl.enableVertexAttribArray(attr);gl.vertexAttribPointer(attr,4,gl.FLOAT,false,16,0);
window.render=({longitude=104,latitude=35,zoom=1.95,selected=-1}={})=>{const a=longitude*Math.PI/180,b=latitude*Math.PI/180;gl.viewport(0,0,canvas.width,canvas.height);gl.clearColor(.958,.943,.911,1);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);gl.enable(gl.DEPTH_TEST);gl.depthFunc(gl.LEQUAL);gl.uniform3fv(gl.getUniformLocation(program,'right'),[-Math.sin(a),0,Math.cos(a)]);gl.uniform3fv(gl.getUniformLocation(program,'up'),[-Math.sin(b)*Math.cos(a),Math.cos(b),-Math.sin(b)*Math.sin(a)]);gl.uniform3fv(gl.getUniformLocation(program,'forward'),[Math.cos(b)*Math.cos(a),Math.sin(b),Math.cos(b)*Math.sin(a)]);gl.uniform1f(gl.getUniformLocation(program,'zoom'),zoom);gl.uniform1f(gl.getUniformLocation(program,'aspect'),canvas.width/canvas.height);gl.uniform1f(gl.getUniformLocation(program,'selected'),selected);gl.bindVertexArray(ocean);gl.drawArrays(gl.TRIANGLES,0,sphere.length/4);for(const mesh of[background,country]){gl.bindVertexArray(mesh.vao);gl.drawElements(gl.TRIANGLES,mesh.count,gl.UNSIGNED_INT,0);}gl.finish();if(gl.getError())throw Error('GPU geometry render failed');};
window.render({selected:m.regions.find(r=>r.id==='540000').index});window.ready=true;
</script>
