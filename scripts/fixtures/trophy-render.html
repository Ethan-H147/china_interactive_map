<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><style>html,body{margin:0;width:100%;height:100%;background:transparent}canvas{display:block;width:100%;height:100%}</style></head><body><script type="module">import {createTrophyViewer} from './trophy-viewer.mjs';let viewer;window.showModel=async (id,file)=>{viewer?.dispose();document.querySelector('canvas')?.remove();const canvas=document.createElement('canvas');document.body.prepend(canvas);viewer=await createTrophyViewer(canvas,file||'data/trophies/'+id+'.glb');window.captureModel=()=>{viewer.draw();return canvas.toDataURL('image/png').split(',')[1];};};window.rendererReady=true;</script></body></html>
