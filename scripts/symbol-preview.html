<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Atlas · Motion studies</title>
<link rel="stylesheet" href="/country-symbols.css"><style>body{margin:0;background:#fffdf8;color:#302c27;font-family:'Segoe UI',sans-serif;padding:7vw}h1{font-family:Georgia,serif;font-weight:400;font-size:40px}p{color:#787166}.studies{display:flex;gap:48px;flex-wrap:wrap;margin:60px 0}.study{width:180px;height:230px;border:1px solid #e7dfd1;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px}.country-symbol{width:76px;height:76px}.soyombo{width:52px;height:102px}button{padding:12px 20px;background:#f6f1e8;border:1px solid #e7dfd1;border-radius:6px}.paused .symbol-rotor{animation-play-state:paused}</style>
<h1>A little motion, a sense of place.</h1><p>Each country has its own loading symbol.</p><div class="studies"></div><button id="pause">Pause animations</button>
<script src="/country-symbols.js"></script><script>const flags={philippines:'ph',argentina:'ar',brazil:'br'};document.querySelector('.studies').innerHTML=['china','korea','mongolia','japan','philippines','indonesia','argentina','brazil'].map(country=>'<div class="study">'+AtlasSymbols.markup(country)+(flags[country]?'<img src="/vendor/flag-'+flags[country]+'.svg" alt="'+country+' flag reference" width="72" height="45">':'')+'<span>'+country[0].toUpperCase()+country.slice(1)+'</span></div>').join('');document.getElementById('pause').onclick=()=>{document.body.classList.toggle('paused');document.getElementById('pause').textContent=document.body.classList.contains('paused')?'Play animations':'Pause animations';};</script></html>
